<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Contacto | Nombre Tienda</title>
</head>
<body>

    <header>
        <a href="index.html"><img src="assets/images/logo.png" alt="Logotipo" width="150"></a>
        <h1>Contacto</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="servicios.html">Servicios</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <main>
        <section>
            <h2>Escríbenos tu Consulta</h2>
            
            <!-- Formulario de Contacto Obligatorio -->
            <form action="#" method="POST">
                
                <!-- Nombre: Máximo 40 caracteres, solo letras y números, con Autofocus -->
                <p>
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" maxlength="40" pattern="[A-Za-z0-9\s]+" placeholder="Ej. Astrid Peña 123" required autofocus>
                </p>

                <!-- Correo electrónico -->
                <p>
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                </p>

                <!-- Edad: Entre 18 y 99 años -->
                <p>
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad" min="18" max="99" placeholder="Rango: 18-99" required>
                </p>

                <!-- Teléfono -->
                <p>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej. 60000000" required>
                </p>

                <!-- Campo de consulta -->
                <p>
                    <label for="consulta">Consulta:</label>
                    <textarea id="consulta" name="consulta" rows="5" placeholder="Escribe aquí tu duda..." required></textarea>
                </p>

                <!-- Casilla de verificación de privacidad -->
                <p>
                    <input type="checkbox" id="privacidad" name="privacidad" required>
                    <label for="privacidad">Acepto la política de privacidad y cookies.</label>
                </p>

                <p>
                    <button type="submit">Enviar Formulario</button>
                </p>
            </form>
        </section>

        <!-- Datos de contacto y enlace telefónico funcional -->
        <section>
            <h3>Datos Directos de Contacto</h3>
            <p>Dirección: Calle la Corriente me pega, N° 555, Ciudad Alicante</p>
            <p>Teléfono de atención: <a href="tel:600000000">600 000 000</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 DIW. <a href="#">Política de privacidad y cookies</a></p>
    </footer>

</body>
</html>
